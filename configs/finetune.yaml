config_name: ft  # used for checkpoint naming and MLflow

model:
  name: Qwen/Qwen3-8B
  max_seq_length: 512
  load_in_4bit: true
  dtype: bfloat16   # RTX 4090 (Ampere) supports bf16; use float16 for older hardware

lora:
  r: 16
  alpha: 32        # lora_alpha = 2 * r (standard starting point)
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 32 across 2 × 4090s × 4 grad acc
  warmup_ratio: 0.03
  num_train_epochs: 3
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler_type: cosine
  seed: 42
  bf16: true
  fp16: false
  logging_steps: 25
  save_strategy: epoch
  save_total_limit: 1
  output_dir: checkpoints/ft_adapter

data:
  train_path: data/finetune_train.jsonl
  max_train_samples: 0   # 0 = use all available training examples

# Must match configs/ft.yaml and configs/ft_rag.yaml system_prompt (base variant)
system_prompt: >-
  You are a financial analyst. Answer the question concisely and precisely.
  If the answer is a number, provide only the number with its unit.

mlflow:
  experiment: ragbench
  run_name: qlora_finetune
